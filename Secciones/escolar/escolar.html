<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papel y Luna</title>

    <link rel="stylesheet" href="stylescolar.css" />
  </head>

  <body>
    <header class="header">
      <div class="header__container">
        <div class="header__logo">
          <h1>Papel y Luna</h1>
        </div>

        <nav class="header__nav">
          <ul class="header__menu">
            <li><a href="../../index.html">Inicio</a></li>
            <li><a href="./escolar.html">Escolar</a></li>
            <li><a href="../oficina/oficina.html">Oficina</a></li>
            <li><a href="../arte/arte.html">Arte</a></li>
            <li><a href="../papeleria/papeleria.html">Papelería</a></li>
          </ul>
        </nav>

        <div class="header__icons">
          <div class="buscador-header">
            <input
              type="text"
              id="input-buscar-header"
              class="input-buscar-header"
              placeholder="Busca un producto..."
            />
            <button id="btn-buscar-header" class="btn-buscar-header">🔍</button>
          </div>
          <a class="carro" href="../../carritopage/carrito.html">🛒</a>
          <span>👤</span>
        </div>
      </div>
    </header>

    <!-- SECCIÓN PRODUCTOS -->
    <section class="productos">
      <div class="productos__container">
        <!-- CUADERNO -->
        <div class="card">
          <img src="../../images/cuaderno.png" alt="Cuaderno" />
          <h3>Cuaderno Profesional</h3>
          <p class="precio">$12.000</p>
          <button class="btn-agregar" data-id="1">Añadir al carrito</button>
        </div>

        <!-- PEGASTICK -->
        <div class="card">
          <img src="../../images/Pegastick.png" alt="Pegastick" />
          <h3>Pegastick</h3>
          <p class="precio">$3.000</p>
          <button class="btn-agregar" data-id="2">Añadir al carrito</button>
        </div>

        <!-- MARCADOR -->
        <div class="card">
          <img src="../../images/marcadores.png" alt="Marcador Permanente" />
          <h3>Marcador Permanente</h3>
          <p class="precio">$4.000</p>
          <button class="btn-agregar" data-id="3">Añadir al carrito</button>
        </div>
      </div>
    </section>
    <section
      id="resultados-busqueda"
      class="resultados-busqueda-container"
    ></section>
    <!-- CONEXIÓN AL CARRITO -->
    <script type="module">
      import { activarBuscadorHeader } from "../../js/buscador.js";
      document.addEventListener("DOMContentLoaded", () => {
        activarBuscadorHeader();
      });
    </script>
    <script type="module" src="../../js/conectarBotones.js"></script>
  </body>
</html>
