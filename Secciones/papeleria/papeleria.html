<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papel y Luna</title>

    <link rel="stylesheet" href="style_papeleria.css" />
  </head>

  <body>
    <header class="header">
      <div class="header__container">
        <div class="header__logo">
          <h1>Papel y Luna</h1>
        </div>

        <nav class="header__nav">
          <ul class="header__menu">
            <li><a href="../../index.html">Inicio</a></li>
            <li><a href="../escolar/escolar.html">Escolar</a></li>
            <li><a href="../oficina/oficina.html">Oficina</a></li>
            <li><a href="../arte/arte.html">Arte</a></li>
            <li><a href="../papeleria/papeleria.html">Papelería</a></li>
          </ul>
        </nav>

        <div class="header__icons">
          <div class="buscador-header">
            <input type="text" id="input-buscar-header" class="input-buscar-header" placeholder="Busca un producto...">
            <button id="btn-buscar-header" class="btn-buscar-header">🔍</button>
          </div>
          <a class="icon-link carro" href="../../carritopage/carrito.html" title="Ver carrito">
            <span class="icon-emoji">🛒</span>
            <span class="icon-label">Carrito</span>
            <span class="icon-badge" id="badge-carrito" style="display:none">0</span>
          </a>
          <a class="icon-link usuario" href="/Jeronimo Rubio_Sebastian Rocha_Ibrahim Safadi" title="Acceso administrativo">
            <span class="icon-emoji">👤</span>
            <span class="icon-label">Cuenta</span>
          </a>
        </div>
      </div>
    </header>


    <section class="productos">
      <div class="productos__container">
 
        <div class="card">
          <img src="../../images/cinta.png" alt="Cinta" />
          <h3>Cinta Adhesiva</h3>
          <p class="precio">$12.000</p>
          <button class="btn-agregar" data-id="10">Añadir al carrito</button>
        </div>

        <div class="card">
          <img src="../../images/papelp.jpeg" alt="Papel de pintura" />
          <h3>Papel de Pintura</h3>
          <p class="precio">$3.000</p>
          <button class="btn-agregar" data-id="11">Añadir al carrito</button>
        </div>

        <div class="card">
          <img src="../../images/tijeras.png" alt="tijeras" />
          <h3>Tijeras</h3>
          <p class="precio">$4.000</p>
          <button class="btn-agregar" data-id="12">Añadir al carrito</button>
        </div>
      </div>
    </section>

    <section id="resultados-busqueda" class="resultados-busqueda-container"></section>

    <script src="../../js/backend.js"></script>
    <script src="../../js/data.js"></script>
    <script src="../../js/ventas.js"></script>
    <script src="../../carritopage/carrito.js"></script>
    <script src="../../js/catalogo.js"></script>
    <script src="../../js/buscador.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.activarBuscadorHeader) window.activarBuscadorHeader();
      });
    </script>
  </body>
</html>
