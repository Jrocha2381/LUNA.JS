<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papel y Luna</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header class="header">
      <div class="header__container">
        <div class="header__logo">
          <h1>Papel y Luna</h1>
        </div>

        <div class="header__icons">
          <a
            class="icon-link carro"
            href="carritopage/carrito.html"
            title="Ver carrito"
          >
            <span class="icon-emoji">🛒</span>
            <span class="icon-label">Carrito</span>
            <span class="icon-badge" id="badge-carrito" style="display: none"
              >0</span
            >
          </a>

          <a
            class="icon-link usuario"
            href="carritopage/acceso-admin.html"
            title="Acceso administrativo"
          >
            <span class="icon-emoji">👤</span>
            <span class="icon-label">Cuenta</span>
          </a>
        </div>
      </div>
    </header>

    <!-- ================= REDIRECCIÓN ================= -->
    <script>
      // Redireccionar a la página principal de administración
      // El usuario solo verá Carrito y Cuenta en el header
      document.addEventListener("DOMContentLoaded", () => {
        // Puedes agregar lógica aquí si es necesaria
      });
    </script>

    <script src="js/backend.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ventas.js"></script>
    <script src="carritopage/carrito.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="js/edicion-flujo.js"></script>
    <script src="js/buscador.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.activarBuscadorHeader) window.activarBuscadorHeader();
        // (POS modo simple) Se oculta el acceso a catálogo/inicio para dejar solo Cuenta y Carrito.
        const btnVerProductos = document.getElementById("btn-ver-productos");
        const seccionProductos = document.getElementById("seccion-productos-inicio");
        if (btnVerProductos) btnVerProductos.style.display = "none";
        if (seccionProductos) seccionProductos.style.display = "none";
      });
    </script>
  </body>
</html>
