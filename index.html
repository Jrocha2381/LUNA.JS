<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papel y Luna</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="carritopage/admin-panel.css" />
    <style>
      /* Ajustes para integrar Buscador y Carrito en la Top Bar */
      .top-bar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 0 30px;
        background: white;
        height: 70px;
        border-bottom: 1px solid #eee;
      }
      .header__icons {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .main-view-container {
        padding: 30px;
        height: calc(100vh - 70px);
        overflow-y: auto;
      }
    </style>
  </head>

  <body class="admin-mode">
    <!-- Estructura de Barra Lateral (Sidebar) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Papel y Luna</h2>
      </div>
      <nav class="nav-menu">
        <a href="#" class="nav-item active" data-categoria="todos">
          <span class="icon">🏠</span> Inicio
        </a>
        <a href="carritopage/acceso-admin.html" class="nav-item">
          <span class="icon">👤</span> Mi Cuenta
        </a>
        <a href="#" class="nav-item" data-categoria="Escolar">
          <span class="icon">🎒</span> Escolar
        </a>
        <a href="#" class="nav-item" data-categoria="Oficina">
          <span class="icon">💼</span> Oficina
        </a>
      </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-content">
      <header class="top-bar">
        <div class="header__icons">
          <div class="buscador-header">
            <input type="text" id="input-buscar-header" class="input-buscar-header" placeholder="Buscar..." />
            <button id="btn-buscar-header" class="btn-buscar-header">🔍</button>
          </div>
          <a class="icon-link carro" href="carritopage/carrito.html">
            <span class="icon-emoji">🛒</span>
            <span class="icon-badge" id="badge-carrito" style="display: none">0</span>
          </a>
        </div>
      </header>

      <div class="main-view-container">
        <section id="seccion-productos-inicio" class="productos-inicio">
            <div class="productos__container"></div>
        </section>
        <section id="resultados-busqueda" class="resultados-busqueda-container"></section>
      </div>
    </main>

    <script src="js/backend.js"></script>
    <script src="js/data.js"></script>
    <script src="carritopage/carrito.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="js/buscador.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.activarBuscadorHeader) window.activarBuscadorHeader();
        if (window.renderizarProductos) window.renderizarProductos();

        // Manejo de filtrado por categorías desde la barra lateral sin recargar página
        const navItems = document.querySelectorAll('.nav-item[data-categoria]');
        const resultadosContainer = document.getElementById("resultados-busqueda");

        navItems.forEach(item => {
          item.addEventListener('click', (e) => {
            e.preventDefault();
            const cat = item.dataset.categoria;

            // Actualizar clase activa
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');

            if (window.renderizarProductos && window.obtenerProductos) {
              if (resultadosContainer) resultadosContainer.innerHTML = ""; // Limpiar búsquedas previas
              const productos = window.obtenerProductos().filter(p => p.activo !== false);
              const filtrados = cat === 'todos' ? productos : productos.filter(p => p.categoria.toLowerCase() === cat.toLowerCase());
              window.renderizarProductos(filtrados);
            }
          });
        });
      });
    </script>
  </body>
</html>
