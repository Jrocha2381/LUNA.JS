<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras | Papelería</title>

  <!-- CSS DEL CARRITO -->
  <link rel="stylesheet" href="stylecarrito.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->
  <header>
    <h1>🛒 Carrito de Compras</h1>
    <a href="../index.html">← Volver a la tienda</a>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main>
    <!-- BUSCADOR -->
    <div class="buscador-container">
      <div class="buscador-wrapper">
        <input 
          type="text" 
          id="input-buscar" 
          class="input-buscar" 
          placeholder="🔍 Busca un producto..."
          autocomplete="off"
        >
        <button id="btn-buscar" class="btn-buscar" title="Buscar">
          🔍
        </button>
        <button id="btn-limpiar" class="btn-limpiar" title="Limpiar búsqueda">✕</button>
      </div>
      <p id="resultados-busqueda" class="resultados-busqueda"></p>
    </div>

    <div class="seccion-pago">
    <label for="metodoPago">Método de Pago:</label>
    <select id="metodoPago">
        <option value="Efectivo">Efectivo</option>
        <option value="Nequi">Nequi</option>
        <option value="Debe">Debe</option>
    </select>

    <div id="grupo-efectivo">
        <label for="valorRecibido">Efectivo Recibido:</label>
        <input type="number" id="valorRecibido" placeholder="0" min="0">
        <div id="display-cambio" style="margin-top: 10px; font-weight: bold; color: #8a9b2f;">
            Cambio: $0
        </div>
    </div>
</div>
   
   
    <!-- ESTE ID ES EL QUE USA carrito.js -->
    <section id="carrito"></section>
  </main>

  <!-- =========================
       JAVASCRIPT
  ========================== -->
  <script type="module">
  import { activarEventosCarrito } from "./carrito.js"; 
  import { activarBuscadorCarrito } from "../js/buscador.js";

  document.addEventListener("DOMContentLoaded", () => {
    activarEventosCarrito();
    activarBuscadorCarrito();
  });
</script>

</body>
</html>
