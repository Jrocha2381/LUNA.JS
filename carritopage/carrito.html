<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito de Compras | Papeleria</title>

    <link rel="stylesheet" href="stylecarrito.css" />
  </head>

  <body>
    <header>
      <h1>Carrito de Compras</h1>
      <a href="../index.html">Volver a la tienda</a>
    </header>

    <main>
      <div class="buscador-container">
        <div class="buscador-wrapper">
          <input
            type="text"
            id="input-buscar"
            class="input-buscar"
            placeholder="Busca un producto..."
            autocomplete="off"
          />
          <button id="btn-buscar" class="btn-buscar" title="Buscar">
            Buscar
          </button>
          <button id="btn-limpiar" class="btn-limpiar" title="Limpiar busqueda">
            Limpiar
          </button>
        </div>
        <p id="resultados-busqueda" class="resultados-busqueda"></p>
      </div>

      <section id="carrito"></section>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/ventas.js"></script>
    <script src="../js/edicion-flujo.js"></script>
    <script src="carrito.js"></script>
    <script src="../js/buscador.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.activarEventosCarrito) window.activarEventosCarrito();
        if (window.activarBuscadorCarrito) window.activarBuscadorCarrito();
      });
    </script>
  </body>
</html>
