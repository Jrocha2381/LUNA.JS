<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Compras - Papel y Luna</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .container-compras { max-width: 900px; margin: 2rem auto; padding: 1.5rem; font-family: 'Segoe UI', sans-serif; }
        .form-compra { background: #fff; padding: 1.5rem; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 2rem; border: 1px solid #eee; }
        .grid-inputs { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 1rem; align-items: end; }
        .input-group { display: flex; flex-direction: column; gap: 0.4rem; }
        label { font-weight: 600; color: #555; font-size: 0.9rem; }
        input, select { padding: 0.7rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
        .btn-add { background: #8a9b2f; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-add:hover { background: #6f7d25; }
        .tabla-compras { width: 100%; border-collapse: collapse; margin-top: 1rem; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .tabla-compras th, .tabla-compras td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        .tabla-compras th { background-color: #f8f9fa; color: #333; font-weight: 600; }
        .footer-compra { display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; padding: 1.5rem; background: #fff; border-radius: 10px; border: 1px solid #eee; }
        .total-label { font-size: 1.5rem; font-weight: 700; color: #8a9b2f; }
        .btn-registrar { background: #28a745; color: white; border: none; padding: 1rem 2.5rem; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: 700; transition: 0.3s; }
        .btn-registrar:hover:not(:disabled) { background: #218838; transform: translateY(-2px); }
        .btn-registrar:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container-compras">
        <h1 style="color: #333; margin-bottom: 0.5rem;">📦 Registro de Compras</h1>
        <p style="color: #666; margin-bottom: 2rem;">Aumenta el stock de productos registrando facturas de proveedores.</p>

        <div class="form-compra">
            <div class="grid-inputs">
                <div class="input-group">
                    <label>Producto</label>
                    <select id="select-producto"></select>
                </div>
                <div class="input-group">
                    <label>Cantidad</label>
                    <input type="number" id="compra-cantidad" min="1" value="1">
                </div>
                <div class="input-group">
                    <label>Costo Unitario</label>
                    <input type="number" id="compra-costo" min="0" placeholder="0">
                </div>
                <button id="btn-agregar-lista" class="btn-add">Añadir</button>
            </div>
        </div>

        <table class="tabla-compras">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Costo Unit.</th>
                    <th>Subtotal</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="lista-items-compra"></tbody>
        </table>

        <div class="footer-compra">
            <div class="total-label">Total: <span id="total-compra-texto">$0</span></div>
            <button id="btn-finalizar-compra" class="btn-registrar" disabled>Finalizar Compra</button>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="carrito.js"></script>
    <script src="../js/compras.js"></script>
    <script src="compras.js"></script>
</body>
</html>
