<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Clientes | Papel y Luna</title>
    <link rel="stylesheet" href="stylecarrito.css" />
  </head>
  <body>
    <header>
      <h1>Gestión de Clientes</h1>
      <div style="display:flex; gap:10px; align-items:center;">
        <button id="btn-sync" class="btn-admin-secundario" style="padding: 5px 10px; font-size: 0.8rem;">
          🔄 Sincronizar
        </button>
      </div>
    </header>

    <main>
      <section class="admin-productos">
        <div style="display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:12px;">
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <button id="btn-nueva" type="button" class="btn-admin-primario">+ Crear cliente</button>
            <div style="display:flex; gap:8px; align-items:center;">
              <input id="cli-buscar" type="text" placeholder="Buscar cliente..." style="padding:10px 12px; border:1px solid #ddd; border-radius:10px; min-width:220px;">
              <span id="cli-contador" style="color:#666; font-size:13px;"></span>
            </div>
          </div>
        </div>

        <form id="cliente-form" class="producto-form">
          <h3 id="form-title">Registrar Nuevo Cliente</h3>
          <div class="form-grid">
            <label>
              Nombre Completo *
              <input type="text" id="cli-nombre" required placeholder="Ej: Juan Pérez" />
            </label>
            <label>
              Teléfono / WhatsApp
              <input type="text" id="cli-telefono" placeholder="310 000 0000" />
            </label>
            <label>
              Email
              <input type="email" id="cli-email" placeholder="cliente@correo.com" />
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" id="btn-guardar" class="btn-admin-primario">Guardar Cliente</button>
            <button type="button" id="btn-cancelar" class="btn-admin-secundario">Cancelar</button>
          </div>
        </form>

        <div class="tabla-wrapper">
          <table class="tabla-productos">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="lista-clientes"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="admin-auth.js"></script>
    <script src="../js/backend.js"></script>
    <script src="../js/entidades-global.js"></script>
    <script src="carrito.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        if (window.validarSesionAdmin && !window.validarSesionAdmin()) return;

        const Entidades = window.Entidades;
        if (!Entidades) {
          if (window.mostrarToast) window.mostrarToast("error", "Clientes", "No se pudo inicializar Entidades.");
          return;
        }

        const form = document.getElementById("cliente-form");
        const tbody = document.getElementById("lista-clientes");
        const btnSync = document.getElementById("btn-sync");
        const btnCancelar = document.getElementById("btn-cancelar");
        const btnNueva = document.getElementById("btn-nueva");
        const inputBuscar = document.getElementById("cli-buscar");
        const contador = document.getElementById("cli-contador");
        let editId = null;

        const notify = (tipo, mensaje) => {
          if (window.mostrarToast) window.mostrarToast(tipo, "Clientes", mensaje);
        };

        const resetForm = () => {
          form.reset();
          editId = null;
          document.getElementById("form-title").textContent = "Registrar Nuevo Cliente";
          document.getElementById("btn-guardar").textContent = "Guardar Cliente";
        };

        const mostrarForm = () => {
          form.style.display = "block";
          document.getElementById("cli-nombre").focus();
        };

        const ocultarForm = () => {
          form.style.display = "none";
        };

        const normalizarTexto = (valor) => String(valor || "").trim().toLowerCase();

        const render = () => {
          const clientes = Entidades.obtener("clientes");
          const q = normalizarTexto(inputBuscar.value);
          const filtrados = q
            ? clientes.filter((c) => {
                const email = c.correo || "";
                return (
                  normalizarTexto(c.nombre).includes(q) ||
                  normalizarTexto(c.telefono).includes(q) ||
                  normalizarTexto(email).includes(q)
                );
              })
            : clientes;

          tbody.innerHTML = filtrados
            .map(
              (c) => `
                <tr>
                  <td><small>${c.id || "-"}</small></td>
                  <td><strong>${c.nombre || "-"}</strong></td>
                  <td>${c.telefono || "-"}</td>
                  <td>${c.correo || "-"}</td>
                  <td>
                    <button class="btn-admin" onclick="window.prepararEdicion('${c.id}', '${(c.nombre || "").replace(/'/g, "\\'")}', '${c.telefono || ""}', '${(c.correo || "").replace(/'/g, "\\'")}')">Editar</button>
                    <button class="btn-admin" style="background:#fee2e2; color:#b91c1c;" onclick="window.eliminarCliente('${c.id}')">Eliminar</button>
                  </td>
                </tr>
              `
            )
            .join("");

          if (contador) contador.textContent = `${filtrados.length}/${clientes.length}`;
        };

        window.prepararEdicion = (id, nombre, telefono, email) => {
          editId = id;
          document.getElementById("cli-nombre").value = nombre;
          document.getElementById("cli-telefono").value = telefono;
          document.getElementById("cli-email").value = email;
          document.getElementById("form-title").textContent = "Editando Cliente";
          document.getElementById("btn-guardar").textContent = "Actualizar Cambios";
          mostrarForm();
        };

        window.eliminarCliente = async (id) => {
          if (confirm("¿Eliminar este cliente de la base de datos?")) {
            await Entidades.eliminar("clientes", id);
            render();
          }
        };

        form.onsubmit = async (e) => {
          e.preventDefault();
          const data = {
            nombre: document.getElementById("cli-nombre").value.trim(),
            telefono: document.getElementById("cli-telefono").value.trim(),
            correo: document.getElementById("cli-email").value.trim()
          };

          if (!data.nombre) {
            notify("error", "El nombre es obligatorio.");
            return;
          }

          if (editId) {
            await Entidades.actualizar("clientes", editId, data);
            notify("success", "Cliente actualizado.");
          } else {
            await Entidades.crear("clientes", data);
            notify("success", "Cliente creado.");
          }

          resetForm();
          ocultarForm();
          render();
        };

        btnCancelar.onclick = () => {
          resetForm();
          ocultarForm();
        };

        btnSync.onclick = async () => {
          btnSync.textContent = "⏳ Sincronizando...";
          btnSync.disabled = true;
          await Entidades.sincronizar("clientes");
          render();
          btnSync.textContent = "🔄 Sincronizar";
          btnSync.disabled = false;
        };

        btnNueva.onclick = () => {
          resetForm();
          mostrarForm();
        };

        inputBuscar.addEventListener("input", render);
        window.addEventListener("clientesActualizados", render);

        ocultarForm();
        await Entidades.sincronizar("clientes").catch(() => {});
        render();
      });
    </script>
  </body>
</html>
