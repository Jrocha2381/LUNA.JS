<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Ventas - Papel y Luna</title>
    <link rel="stylesheet" href="stylhistorial.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>📊 Historial de Ventas</h1>
        </div>
    </header>

    <main>
        <section class="historial-container">
            <!-- Controles y Filtros -->
            <div class="controles-historial">
                <!-- Búsqueda rápida -->
                <div class="busqueda-control">
                    <input 
                        type="text" 
                        id="buscar-venta" 
                        class="input-buscar-venta" 
                        placeholder="Buscar por ticket o fecha..."
                    >
                </div>

                <!-- Panel de Filtros -->
                <div class="panel-filtros">
                    <button id="toggle-filtros" class="btn-toggle-filtros">🔽 Filtros Avanzados</button>
                </div>

                <!-- Controles de acción -->
                <div class="botones-control">
                    <button id="limpiar-busqueda" class="btn-limpiar">Limpiar</button>
                    <button id="ordenar-ventas" class="btn-ordenar">⬇️ Más recientes</button>
                    <button id="descargar-reporte" class="btn-descargar">📥 Descargar</button>
                </div>
            </div>

            <!-- Filtros Avanzados (oculto por defecto) -->
            <div id="filtros-avanzados" class="filtros-avanzados" style="display: none;">
                <div class="filtros-grid">
                    <!-- Filtro de fechas -->
                    <div class="filtro-grupo">
                        <label>📅 Fecha desde:</label>
                        <input type="date" id="fecha-desde" class="input-filtro">
                    </div>
                    <div class="filtro-grupo">
                        <label>📅 Fecha hasta:</label>
                        <input type="date" id="fecha-hasta" class="input-filtro">
                    </div>

                    <!-- Filtro de montos -->
                    <div class="filtro-grupo">
                        <label>💰 Monto mínimo:</label>
                        <input type="number" id="monto-minimo" class="input-filtro" placeholder="0">
                    </div>
                    <div class="filtro-grupo">
                        <label>💰 Monto máximo:</label>
                        <input type="number" id="monto-maximo" class="input-filtro" placeholder="999999">
                    </div>

                    <!-- Filtro de método de pago -->
                    <div class="filtro-grupo">
                        <label>💳 Método de pago:</label>
                        <select id="metodo-pago-filtro" class="input-filtro">
                            <option value="">Todos</option>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Tarjeta Credito">Tarjeta Crédito</option>
                            <option value="Tarjeta Debito">Tarjeta Débito</option>
                            <option value="Transferencia">Transferencia</option>
                        </select>
                    </div>

                    <!-- Filtro de cantidad de items -->
                    <div class="filtro-grupo">
                        <label>🛍️ Mín. items:</label>
                        <input type="number" id="items-minimo" class="input-filtro" placeholder="1" min="1">
                    </div>

                    <!-- Botones de filtro -->
                    <div class="filtro-grupo-acciones">
                        <button id="aplicar-filtros" class="btn-aplicar-filtros">✅ Aplicar Filtros</button>
                        <button id="limpiar-filtros" class="btn-limpiar-filtros">🔄 Resetear</button>
                    </div>
                </div>
                <div id="filtros-activos" class="filtros-activos"></div>
            </div>

            <!-- Mensaje si no hay ventas -->
            <div id="sin-ventas" class="sin-ventas-container">
                <p class="icono">📭</p>
                <p>No hay ventas registradas aún.</p>
                <a href="../index.html" class="btn-primario">Ir a la tienda</a>
            </div>

            <!-- Lista de ventas cerradas -->
            <div id="lista-ventas" class="lista-ventas"></div>
        </section>
    </main>

    <!-- Modal de Confirmación para Eliminar -->
    <div id="modal-confirmar" class="modal-confirmar">
        <div class="modal-contenido">
            <h3>⚠️ Confirmar eliminación</h3>
            <p>¿Deseas eliminar este registro de venta? Esta acción no se puede deshacer.</p>
            <div class="modal-botones">
                <button id="cancelar-eliminar" class="btn-cancelar">Cancelar</button>
                <button id="confirmar-eliminar" class="btn-eliminar">Eliminar</button>
            </div>
        </div>
    </div>

    <script src="admin-auth.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/ventas.js"></script>
    <script src="historial.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.validarSesionAdmin && !window.validarSesionAdmin()) return;
            if (window.inicializarHistorial) window.inicializarHistorial();
        });
    </script>
</body>
</html>
