<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Administrativo | Papel y Luna</title>
    <link rel="stylesheet" href="stylecarrito.css" />
  </head>
  <body>
    <header>
      <h1>Panel Administrativo</h1>
      <div style="display: flex; gap: 10px; align-items: center">
        <a href="acceso-admin.html">Menu de cuenta</a>
        <a href="../index.html">Volver a la tienda</a>
      </div>
    </header>

    <main>
      <section class="admin-productos admin-entidades">
        <div class="admin-top">
          <div>
            <h2>Gestión de entidades</h2>
            <p class="descripcion">
              Administra clientes, proveedores y categorías desde el mismo panel
              administrativo.
            </p>
          </div>
        </div>

        <div class="admin-tabs">
          <button type="button" class="tab active" data-entity="clientes">
            Clientes
          </button>
          <button type="button" class="tab" data-entity="proveedores">
            Proveedores
          </button>
          <button type="button" class="tab" data-entity="categorias">
            Categorías
          </button>
        </div>

        <div class="entity-tools">
          <input
            id="entity-search"
            class="input-buscar"
            type="search"
            placeholder="Buscar en la entidad..."
          />
        </div>

        <form id="entity-form" class="producto-form">
          <h3 id="entity-form-title">Crear cliente</h3>
          <input type="hidden" name="id" />
          <div id="form-fields" class="form-grid"></div>
          <div class="form-actions">
            <button id="entity-submit" type="submit" class="btn-admin-primario">
              Guardar Cliente
            </button>
            <button
              id="entity-reset"
              type="button"
              class="btn-admin-secundario"
            >
              Limpiar
            </button>
          </div>
        </form>

        <div id="admin-message" class="mensaje oculto"></div>
        <div id="admin-loader" class="loader oculto">Cargando...</div>

        <div class="tabla-wrapper">
          <table class="tabla-productos tabla-entidades">
            <thead>
              <tr id="entity-table-head"></tr>
            </thead>
            <tbody id="entity-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="admin-auth.js"></script>
    <script src="admin-api.js"></script>
    <script src="admin-crud.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/ventas.js"></script>
    <script src="carrito.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (!window.validarSesionAdmin || !window.validarSesionAdmin()) return;
        if (window.renderAdminProductos) window.renderAdminProductos();
        if (window.activarEventosAdmin) window.activarEventosAdmin();
      });
    </script>
  </body>
</html>
