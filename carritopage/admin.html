<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Administrativo | Papel y Luna</title>
    <link rel="stylesheet" href="stylecarrito.css" />
  </head>
  <body>
    <header>
      <h1>Panel Administrativo</h1>
      <div style="display:flex; gap:10px; align-items:center;">
        <a href="acceso-admin.html">Menu de cuenta</a>
        <a href="../index.html">Volver a la tienda</a>
      </div>
    </header>

    <main>
      <section class="admin-productos">
        <h2>CRUD de productos</h2>

        <form id="producto-form" class="producto-form">
          <h3 id="producto-form-title">Crear producto</h3>

          <div class="form-grid">
            <label>
              Nombre *
              <input type="text" name="nombre" required />
            </label>

            <label>
              Categoria *
              <select name="categoria" id="producto-categoria" required></select>
            </label>


            <label>
              Precio de venta *
              <input type="number" name="precioVenta" min="0" step="0.01" required />
            </label>

            <label>
              Costo *
              <input type="number" name="costo" min="0" step="0.01" required />
            </label>

            <label>
              Proveedor *
              <select name="proveedorId" id="producto-proveedor" required></select>
            </label>

            <label class="checkbox-label">
              <input type="checkbox" name="seguimientoInventario" checked />
              Seguimiento de inventario
            </label>


            <label>
              Stock
              <input type="number" name="stock" min="0" step="1" value="0" />
            </label>

            <label>
              URL imagen (opcional)
              <input type="text" name="imagen" placeholder="../images/archivo.png" />
            </label>

            <label>
              Imagen desde tu equipo (opcional)
              <input type="file" name="imagenArchivo" accept="image/*" />
            </label>

            <label>
              Descripcion
              <input type="text" name="descripcion" />
            </label>
          </div>

          <div class="form-actions">
            <button id="producto-submit" type="submit" class="btn-admin-primario">
              Guardar producto
            </button>
            <button id="producto-cancelar" type="button" class="btn-admin-secundario">
              Cancelar
            </button>
          </div>
        </form>

        <div class="tabla-wrapper">
          <table class="tabla-productos">
            <thead>
              <tr>
                <th>ID</th>
                <th>Codigo interno</th>
                <th>Nombre</th>
                <th>Categoria</th>
                <th>Proveedor</th>
                <th>Venta</th>
                <th>Costo</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="admin-productos-body"></tbody>
          </table>

        </div>
      </section>
    </main>

    <script src="admin-auth.js"></script>
    <script src="../js/backend.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/ventas.js"></script>
    <script src="carrito.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (!window.validarSesionAdmin || !window.validarSesionAdmin()) return;

        // (Re)llenar selects dinámicos (categorías/proveedores) antes de renderizar
        try {
          if (window.populateCategoriaSelect) window.populateCategoriaSelect();
          if (window.populateProveedorSelect) window.populateProveedorSelect();
        } catch (e) {
          // noop
        }

        if (window.renderAdminProductos) window.renderAdminProductos();
        if (window.activarEventosAdmin) window.activarEventosAdmin();
      });
    </script>
  </body>
</html>
