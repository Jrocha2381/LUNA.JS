services:
  - type: web
    name: rpg-api
    runtime: node
    plan: free
    buildCommand: "npm install && npm run migrate"
    startCommand: "npm start"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_AUTO_SYNC
        value: "false"
